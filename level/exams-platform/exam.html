<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الامتحان | منصة الامتحانات التقنية</title><link rel="stylesheet" href="css/style.css"></head>
<body data-theme="light">
<main style="margin-right:0; padding-top:24px;">
    <div class="exam-layout">
        <div class="exam-topbar"><a href="index.html" class="back-link">→ العودة إلى لوحة التحكم</a><button class="theme-toggle" id="theme-toggle-btn" type="button">☾ الوضع الداكن</button></div>
        <div class="exam-topbar"><a href="index.html" class="back-link">→ العودة إلى المنصه</a></div>
        <section class="exam-box">
            <div class="question-header"><div class="question-title-wrap"><p class="page-eyebrow">منطقة الاختبار</p><h2 id="exam-title-header">اسم الامتحان</h2><p>اختر إجابة واحدة لكل سؤال، ويمكنك التنقل بين الأسئلة قبل التسليم.</p></div><span id="timer-display" class="timer-chip">◷ الوقت المتبقي: --:--</span></div>

            <div id="question-container"></div>
            <div class="exam-footer"><div class="exam-footer-right"><button class="btn btn-secondary" id="prev-btn" type="button">السؤال السابق</button></div><div class="exam-footer-left"><button class="btn btn-secondary" id="mark-btn" type="button">☆ مراجعة لاحقًا</button><button class="btn" id="next-btn" type="button">السؤال التالي</button></div></div>
        </section>
    </div>
</main>
<script src="js/questions.data.js"></script><script src="js/app.js"></script><script src="js/exam.js"></script>
